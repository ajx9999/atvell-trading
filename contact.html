/* HEADER */
header {

    top: 0; left: 0;

    display: flex;

}

    display: flex;

    text-decoration: none;
}

.logo-title img {

}

.brand-title {

    white-space: nowrap;

}

/* DESKTOP NAV */

    gap: 28px;

}

nav a {
    color: #4a3d29;
    text-decoration: none;
    white-space: nowrap;
    font-weight: 500;
}

nav a:hover {
    color: #c9a55a;
}

/* HAMBURGER (MOBILE) */
.hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
}

.hamburger div {
    width: 26px;
    height: 3px;
    background: #4a3d29;
}

/* MOBILE DROPDOWN NAV */
.mobile-nav {
    display: none;
    flex-direction: column;
    background: white;
    width: 100%;
    padding: 20px;
    border-bottom: 1px solid #e8dfd4;
}

.mobile-nav a {
    padding: 12px 0;
    font-size: 18px;
    color: #4a3d29;
    font-weight: 500;
    border-bottom: 1px solid #f0e8dc;
    text-decoration: none;
}

.mobile-nav a:hover {
    color: #c9a55a;
}

/* CONTENT */
.section {
    padding: 40px;
    max-width: 900px;
    margin: auto;
}

h1 {
    font-size: 45px;
    margin-bottom: 20px;
    color: #4a3d29;
}

p {
    font-size: 18px;
    color: #5a5040;

/* FIX LINK COLOUR */
a {

    text-decoration: none;
    font-weight: 600;

a:hover {
