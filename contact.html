/* FIXED HEADER */
header {
    width: 100%;

    position: fixed;
    top: 0; left: 0;

    display: flex;
    justify-content: space-between;

    white-space: nowrap;
    color: #4a3d29;
}

    transform: translateX(-60px);
}

nav a {
    margin-left: 25px;
    color: #4a3d29;
    text-decoration: none;
    white-space: nowrap;
    font-weight: 500;

nav a:hover {

}

a {
    color: #4a3d29;
    text-decoration: none;
    font-weight: 600;

a:hover {
    color: #c9a55a;

/* MAP */
.map {

    height: 350px;
    border-radius: 12px;
    overflow: hidden;

/* WHATSAPP BUTTON */
.whatsapp-float {

    right: 24px;
    bottom: 24px;
    z-index: 99999;
}

.whatsapp-float img {
    width: 65px;
}

/* MOBILE RESPONSIVE */
@media(max-width: 900px){
    nav { transform: translateX(-10px); }
    header { padding: 0 20px; height: 80px; }
    .brand-title { font-size: 16px; }
    h1 { font-size: 32px; }
