<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products | Atvell Trading Sdn Bhd - Wholesale Souvenirs</title>

<!-- SEO -->
<meta name="description" content="View sample products from Atvell Trading Sdn Bhd, a trusted Malaysian wholesale supplier of cultural souvenirs, religious items and temple gifts.">
<meta name="keywords" content="wholesale souvenirs, temple souvenirs, cultural products Malaysia, religious statues wholesale, souvenir supplier, Batu Caves gift shop">
<meta name="robots" content="index, follow">

<!-- Open Graph -->
<meta property="og:title" content="Atvell Trading - Wholesale Souvenirs & Cultural Products">
<meta property="og:description" content="Trusted supplier of souvenirs, religious items and cultural products since 1968.">
<meta property="og:image" content="assets/images/atvelllogo.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* GLOBAL */
body {
    margin: 0;
    padding-top: 120px;
    background: #f7f4ef;
    font-family: 'Poppins', sans-serif;
}

/* HEADER */
header {
    width: 100%;
    height: 90px;
    background: white;
    border-bottom: 1px solid #e8dfd4;

    position: fixed;
    top: 0; left: 0;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 40px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.05);
    z-index: 9999;
    box-sizing: border-box;
}

/* LOGO */
.logo-title a {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
}

.logo-title img {
    height: 55px;
}

.brand-title {
    font-size: 20px;
    font-weight: 600;
    color: #4a3d29;
    white-space: nowrap;
}

/* DESKTOP NAV */
nav {
    display: flex;
    gap: 28px;
    transform: translateX(-40px);
}

nav a {
    text-decoration: none;
    white-space: nowrap;
    color: #4a3d29;
    font-weight: 500;
}

nav a:hover {
    color: #c9a55a;
}

/* MOBILE HAMBURGER */
.hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
}

.hamburger div {
    width: 26px;
    height: 3px;
    background: #4a3d29;
}

/* MOBILE DROPDOWN MENU */
.mobile-nav {
    display: none;
    flex-direction: column;
    width: 100%;
    background: white;
    padding: 20px;
    border-bottom: 1px solid #e8dfd4;
}

.mobile-nav a {
    padding: 12px 0;
    border-bottom: 1px solid #f0e8dc;
    font-size: 18px;
    font-weight: 500;
    color: #4a3d29;
    text-decoration: none;
}

.mobile-nav a:hover {
    color: #c9a55a;
}

/* CONTENT */
.section {
    padding: 40px;
    max-width: 1100px;
    margin: auto;
}

h1 {
    font-size: 45px;
    margin-bottom: 20px;
    color: #4a3d29;
}

.note {
    text-align: center;
    font-size: 18px;
    color: #5a5040;
    margin-bottom: 25px;
}

/* PRODUCT GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 14px 32px rgba(0,0,0,0.12);
}

.card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 12px;
}

/* WHATSAPP BUTTON */
.whatsapp-float {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 99999;
}

.whatsapp-float img {
    width: 65px;
}

/* RESPONSIVE */
@media(max-width: 900px){

    nav {
        display: none;
    }

    .hamburger {
        display: flex;
    }

    header {
        height: 80px;
        padding: 0 20px;
    }

    .brand-title {
        font-size: 16px;
    }

    h1 {
        font-size: 32px;
    }
}

</style>
</head>

<body>

<header>

    <!-- LOGO -->
    <div class="logo-title">
        <a href="index.html">
            <img src="assets/images/atvelllogo.png" alt="Atvell Trading Logo">
            <span class="brand-title">Atvell Trading Sdn Bhd</span>
        </a>
    </div>

    <!-- DESKTOP NAV -->
    <nav>
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT US</a>
        <a href="products.html" style="color:#c9a55a;">PRODUCTS</a>
        <a href="contact.html">CONTACT US</a>
    </nav>

    <!-- MOBILE HAMBURGER -->
    <div class="hamburger" onclick="toggleMobileMenu()">
        <div></div><div></div><div></div>
    </div>
</header>

<!-- MOBILE MENU -->
<div class="mobile-nav" id="mobileNav">
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT US</a>
    <a href="products.html">PRODUCTS</a>
    <a href="contact.html">CONTACT US</a>
</div>

<section class="section">

<h1>Our Products</h1>

<div class="note">
    These are just samples. For more products, please visit us or contact us.
</div>

<div class="grid">

    <div class="card"><img src="assets/images/product1.jpg" alt="product1 sample"></div>
    <div class="card"><img src="assets/images/product2.jpg" alt="product2 sample"></div>
    <div class="card"><img src="assets/images/product3.jpg" alt="product3 sample"></div>

    <div class="card"><img src="assets/images/product4.jpg" alt="product4 sample"></div>
    <div class="card"><img src="assets/images/product5.jpg" alt="product5 sample"></div>
    <div class="card"><img src="assets/images/product6.jpg" alt="product6 sample"></div>

    <div class="card"><img src="assets/images/product7.jpg" alt="product7 sample"></div>
    <div class="card"><img src="assets/images/product8.jpg" alt="product8 sample"></div>
    <div class="card"><img src="assets/images/product9.jpg" alt="product9 sample"></div>

</div>

</section>

<!-- WHATSAPP -->
<a class="whatsapp-float" href="https://wa.me/01118889942" target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp Chat">
</a>

<!-- JS -->
<script>
function toggleMobileMenu() {
    const menu = document.getElementById("mobileNav");
    menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
}
</script>

</body>
</html>
