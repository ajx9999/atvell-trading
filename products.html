<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products - Atvell Trading</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* GLOBAL */
body {
    margin: 0;
    padding-top: 120px;
    background: #f7f4ef;
    font-family: 'Poppins', sans-serif;
}

/* FIXED HEADER */
header {
    width: 100%;
    height: 90px;
    background: white;
    border-bottom: 1px solid #e8dfd4;

    position: fixed;
    top: 0; left: 0;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 40px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.05);
    z-index: 9999;
}

/* CLICKABLE LOGO + NAME */
.logo-title a {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
}

.logo-title img {
    height: 55px;
}

.brand-title {
    font-size: 20px;
    font-weight: 600;
    white-space: nowrap;
    color: #4a3d29;
}

/* FIXED TASKBAR (SHIFTED LEFT) */
nav {
    transform: translateX(-60px);
}

nav a {
    margin-left: 25px;
    text-decoration: none;
    white-space: nowrap;
    color: #4a3d29;
    font-weight: 500;
}

nav a:hover {
    color: #c9a55a;
}

/* ENSURE LINKS NEVER TURN BLUE */
a {
    color: #4a3d29;
    text-decoration: none;
}

a:hover {
    color: #c9a55a;
}

/* PRODUCT SECTION */
.section {
    padding: 40px;
    max-width: 1100px;
    margin: auto;
}

h1 {
    font-size: 45px;
    margin-bottom: 20px;
    color: #4a3d29;
}

.note {
    text-align: center;
    font-size: 18px;
    color: #5a5040;
    margin-bottom: 25px;
}

/* PRODUCT GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 14px 32px rgba(0,0,0,0.12);
}

.card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 12px;
}

/* WHATSAPP BUTTON */
.whatsapp-float {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 99999;
}

.whatsapp-float img {
    width: 65px;
}

/* MOBILE FRIENDLY */
@media(max-width: 900px){
    nav { transform: translateX(-10px); }
    header { height: 80px; padding: 0 20px; }
    .brand-title { font-size: 16px; }
    h1 { font-size: 32px; }
}

</style>
</head>

<body>

<header>
    <div class="logo-title">
        <a href="index.html">
            <img src="assets/images/atvelllogo.png">
            <span class="brand-title">Atvell Trading Sdn Bhd</span>
        </a>
    </div>

    <nav>
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT US</a>
        <a href="products.html" style="color:#c9a55a;">PRODUCTS</a>
        <a href="contact.html">CONTACT US</a>
    </nav>
</header>

<section class="section">

<h1>Our Products</h1>

<div class="note">
    These are just samples. For more products, please visit us or contact us.
</div>

<div class="grid">
    <div class="card"><img src="assets/images/rubberstamp.jpg"></div>
    <div class="card"><img src="assets/images/namecard.jpg"></div>
    <div class="card"><img src="assets/images/idcard.jpg"></div>

    <div class="card"><img src="assets/images/souvenir.jpg"></div>
    <div class="card"><img src="assets/images/keychain.jpg"></div>
    <div class="card"><img src="assets/images/lamination.jpg"></div>

    <div class="card"><img src="assets/images/binding.jpg"></div>
    <div class="card"><img src="assets/images/photocopy.jpg"></div>
    <div class="card"><img src="assets/images/banner.jpg"></div>
</div>

</section>

<a class="whatsapp-float" href="https://wa.me/01118889942" target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
</a>

</body>
</html>
