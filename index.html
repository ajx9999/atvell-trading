<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atvell Trading Sdn Bhd</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* GLOBAL */
body {
    margin: 0;
    padding-top: 120px;
    background: #f7f4ef;
    font-family: 'Poppins', sans-serif;
}

/* FIXED HEADER */
header {
    width: 100%;
    height: 90px;
    background: #ffffff;
    border-bottom: 1px solid #e8dfd4;

    position: fixed;
    top: 0;
    left: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 40px;

    box-shadow: 0 2px 20px rgba(0,0,0,0.05);
    z-index: 9999;
}

/* CLICKABLE LOGO + NAME */
.logo-title a {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
}

.logo-title img {
    height: 55px;
}

.brand-title {
    font-size: 20px;
    font-weight: 600;
    white-space: nowrap;
    color: #4a3d29;
}

/* FIXED TASKBAR — SHIFT LEFT */
nav {
    transform: translateX(-60px);
}

nav a {
    margin-left: 25px;
    color: #4a3d29;
    font-weight: 500;
    white-space: nowrap;
    text-decoration: none;
}

nav a:hover {
    color: #c9a55a;
}

/* ENSURE ALL LINKS ARE GOLD/BLACK — NOT BLUE */
a {
    color: #4a3d29;
    text-decoration: none;
}

a:hover {
    color: #c9a55a;
}

/* SLIDESHOW */
.slideshow-container {
    width: 100%;
    height: 460px;
    overflow: hidden;
    border-radius: 20px;
    position: relative;
}

.slide {
    position: absolute;
    width: 100%;
    height: 460px;
    opacity: 0;
    transition: opacity 1s ease;
}

.slide.active {
    opacity: 1;
}

.slide img {
    width: 100%;
    height: 460px;
    object-fit: cover;
}

/* HERO TEXT */
.hero-content {
    padding: 40px;
    max-width: 900px;
}

.hero-content h1 {
    font-size: 45px;
    font-weight: 700;
    color: #4a3d29;
}

.hero-content p {
    font-size: 18px;
    color: #5a5040;
}

/* BUTTON */
.btn {
    display: inline-block;
    padding: 14px 30px;
    background: #4a3d29;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-size: 16px;
    transition: 0.3s;
}

.btn:hover {
    background: #c9a55a;
}

/* WHATSAPP BUTTON */
.whatsapp-float {
    position: fixed;
    right: 25px;
    bottom: 25px;
    z-index: 99999;
}

.whatsapp-float img {
    width: 65px;
}

/* RESPONSIVE */
@media(max-width: 900px){
    header {
        height: 80px;
        padding: 0 20px;
    }

    .brand-title {
        font-size: 16px;
    }

    nav {
        transform: translateX(-10px);
    }

    .slideshow-container {
        height: 280px;
    }

    .slide img {
        height: 280px;
    }

    .hero-content h1 {
        font-size: 32px;
    }

    .hero-content p {
        font-size: 16px;
    }
}

</style>
</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo-title">
        <a href="index.html">
            <img src="assets/images/atvelllogo.png">
            <span class="brand-title">Atvell Trading Sdn Bhd</span>
        </a>
    </div>

    <nav>
        <a href="index.html" style="color:#c9a55a;">HOME</a>
        <a href="about.html">ABOUT US</a>
        <a href="products.html">PRODUCTS</a>
        <a href="contact.html">CONTACT US</a>
    </nav>
</header>

<!-- SLIDESHOW -->
<div class="slideshow-container">
    <div class="slide active"><img src="assets/images/slide1.jpg"></div>
    <div class="slide"><img src="assets/images/slide2.jpg"></div>
    <div class="slide"><img src="assets/images/slide3.jpg"></div>
</div>

<!-- HERO SECTION -->
<section class="hero-content">
    <h1>Welcome to Atvell Trading</h1>
    <p>Providing trusted cultural items and souvenirs since 1968.</p>
    <a class="btn" href="products.html">View Our Products</a>
</section>

<!-- WHATSAPP BUTTON -->
<a class="whatsapp-float" href="https://wa.me/01118889942" target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
</a>

<!-- SLIDESHOW SCRIPT -->
<script>
let slides = document.querySelectorAll(".slide");
let index = 0;

setInterval(() => {
    slides[index].classList.remove("active");
    index = (index + 1) % slides.length;
    slides[index].classList.add("active");
}, 3500);
</script>

</body>
</html>
